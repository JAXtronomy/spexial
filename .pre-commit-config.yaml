default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2025.11.21
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.9"
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==23.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.7.4"
    hooks:
      - id: prettier
        types_or: [yaml, html, css, scss, javascript, json, markdown]

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["tomli"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # pyright / ty / mypy are each scoped to the `tests/typing` fixture (see
  # [tool.pyright], [tool.ty.src] and [tool.mypy] in pyproject.toml) -- they
  # guard the public signatures, not the whole tree, which is not yet clean
  # under any of the three. Each runs via `uv run` so that `spexial` and its
  # dependencies actually resolve; a bare checker could not import the package.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (typing guard)
        entry: uv run --frozen --group typecheck pyright
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

      - id: ty
        name: ty (typing guard)
        entry: uv run --frozen --group typecheck ty check
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

      - id: mypy
        name: mypy (typing guard)
        entry: uv run --frozen --group typecheck mypy
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest|\bJax\b|\bScipy\b
        exclude: .pre-commit-config.yaml
