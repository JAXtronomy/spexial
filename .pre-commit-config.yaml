default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 9f3ec868c0429155a46b4819b625d47a8522a3d5 # v4.10.0
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 61489a7c52bc75d47a8b25fb633e0d7836b197ce # 2025.11.21
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0fe8648804a32455c690e0519c217f8cee6a48c6 # 0.36.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: d96cc7adddf7d15b77f99dbd5d20e037dfd1b29c # v0.14.9
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: fda77690955e9b63c6687d8806bafd56a526e45f # 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==23.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 14abee445aea04b39069c19b4bd54efff6775819 # v3.7.4
    hooks:
      - id: prettier
        types_or: [yaml, html, css, scss, javascript, json, markdown]

  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac # v2.4.1
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["tomli"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: e90530d2cface051bb46cbd33f2362558e5ee9fb # 0.9.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: ade0f95ddcf661c697d4670d2cfcbe95d0048a0a # v0.9.3
    hooks:
      - id: taplo-format

  # pyright / ty / mypy are each scoped to the `tests/typing` fixture (see
  # [tool.pyright], [tool.ty.src] and [tool.mypy] in pyproject.toml) -- they
  # guard the public signatures, not the whole tree, which is not yet clean
  # under any of the three. Each runs via `uv run` so that `spexial` and its
  # dependencies actually resolve; a bare checker could not import the package.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (typing guard)
        entry: uv run --frozen --group typecheck pyright
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

      - id: ty
        name: ty (typing guard)
        entry: uv run --frozen --group typecheck ty check
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

      - id: mypy
        name: mypy (typing guard)
        entry: uv run --frozen --group typecheck mypy
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest|\bJax\b|\bScipy\b
        exclude: .pre-commit-config.yaml
