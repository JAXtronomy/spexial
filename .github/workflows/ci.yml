name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the ref: a `push` to main and a
  # `workflow_dispatch` on the same ref otherwise share a group and, with
  # `cancel-in-progress`, cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3
  # Single source of truth for the supported Python versions. The `tests` job's
  # exclude list below hardcodes the non-newest entries; update it if this
  # changes, or macOS/Windows will silently run the full matrix (GitHub Actions
  # does not warn when exclude entries go stale).
  PYTHON_VERSIONS: '["3.11", "3.13", "3.14"]'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ env.PYTHON_VERSIONS }}
      oldest-python: ${{ steps.versions.outputs.oldest }}
      newest-python: ${{ steps.versions.outputs.newest }}
    steps:
      - id: versions
        run: |
          versions='${{ env.PYTHON_VERSIONS }}'
          oldest=$(echo "$versions" | jq -r '.[0]')
          newest=$(echo "$versions" | jq -r '.[-1]')
          echo "oldest=$oldest" >> $GITHUB_OUTPUT
          echo "newest=$newest" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install
        run: uv sync --no-default-groups --group lint --locked

      # Runs every hook in .pre-commit-config.yaml, including the pinned
      # pyright/ty/mypy typing guards scoped to `tests/typing/`. Deliberately
      # not split into per-checker jobs -- that would just double-run the hooks.
      - name: Checks with prek
        run: uv run --frozen prek run --all-files

      # The Citation File Format project's own validator, against its own
      # schema. Not reimplemented in the test suite: `tests/unit/test_citation.py`
      # checks only what is specific to this repository -- that the file agrees
      # with `pyproject.toml` -- and leaves the schema to the people who define
      # it. Here rather than as a test dependency because `cffconvert` pins
      # `jsonschema<4` and pulls `requests` and `pykwalify` with it.
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"

  # Fast, broad checks -- the package imports and its public API re-exports.
  # Gates the full multi-OS/multi-Python matrix below: catches "the package is
  # broken" in well under a minute instead of waiting on the whole matrix.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [setup, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install
        run: uv sync --no-default-groups --group test --locked

      - name: Smoke test
        run: uv run --frozen pytest -x tests/smoke

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, lint, smoke]
    # Windows is advisory. numpy on the Windows runners is built with MINGW-W64
    # and cannot probe `longdouble`; importing it emits RuntimeWarnings from
    # `numpy._core.getlimits` during *collection*, before pytest installs the
    # `filterwarnings` from `pyproject.toml`, so config cannot suppress them and
    # the run dies before a single test executes. That is a numpy packaging
    # problem on that platform, not a defect here, and it should not block a
    # merge -- but the leg still runs, so a genuine Windows regression is
    # visible in the checks rather than hidden by dropping the platform.
    continue-on-error: ${{ matrix.runs-on == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        # macOS runners bill at 10x the Linux rate and Windows at 2x
        # (https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/about-billing-for-github-actions).
        # All 3 Python versions are already fully exercised on Linux; running
        # them again on macOS/Windows is cross-OS coverage, not cross-version
        # coverage, so one version per non-Linux OS is enough to catch a
        # platform-specific break. Pin it to the newest version so it also
        # doubles as a "does the latest supported Python work on this OS" check.
        exclude:
          - runs-on: macos-latest
            python-version: "3.11"
          - runs-on: macos-latest
            python-version: "3.13"
          - runs-on: windows-latest
            python-version: "3.11"
          - runs-on: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group test --locked

      # --dist=loadfile is required, not tuning: Sybil's doctest regions within
      # one document share a namespace and must run in order in a single
      # worker. The default --dist=load would shard them and break those tests.
      - name: Test with pytest
        run: >-
          uv run --frozen pytest --cov --cov-report=xml --cov-report=term
          --durations=20 -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  oldest-supported:
    name: Oldest supported deps
    runs-on: ubuntu-latest
    needs: [setup, lint, smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ needs.setup.outputs.oldest-python }}

      - name: Install the project
        run: uv sync --no-default-groups --group test --resolution lowest-direct

      - name: Test package
        run: uv run --no-sync pytest -n logical --dist=loadfile

  newest-supported:
    name: Newest supported deps
    runs-on: ubuntu-latest
    needs: [setup, lint, smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install the project
        run: uv sync --no-default-groups --group test --upgrade

      - name: Test package
        run: uv run --no-sync pytest -n logical --dist=loadfile

  # Gate on the docs building cleanly. `--strict` is load-bearing: a plain
  # `zensical build` exits 0 even when it reports unresolved cross-references,
  # so without it a broken link never fails CI -- it just renders as unlinked
  # text that nobody notices.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install
        run: uv sync --no-default-groups --group docs --locked

      - name: Build docs
        run: uv run --frozen zensical build --clean --strict

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [setup, lint, smoke, tests, oldest-supported, newest-supported, docs]
    if: ${{ !cancelled() }}
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
