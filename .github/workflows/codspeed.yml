name: CodSpeed

# Runs on every PR and every push to main, deliberately: CodSpeed compares a PR
# against the base commit's measurements, so gating this behind a label would
# leave the baseline missing exactly when a comparison is wanted.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

env:
  FORCE_COLOR: 3

jobs:
  benchmarks:
    name: Run benchmarks
    # Pinned, not `ubuntu-latest`, so an image roll cannot land mid-comparison:
    # CodSpeed compares against the base commit's measurements, and a baseline
    # recorded before a roll is not comparable with a PR measured after it. Bump
    # this deliberately.
    #
    # This pin alone does not make runs comparable, and on its own it did not
    # fix "Different runtime environments detected" -- the runs on either side of
    # it already reported `Image: ubuntu-24.04` and Python 3.11.16. What actually
    # varied was the runner's CPU and core count leaking into the measurement;
    # that is pinned in `benchmarks/conftest.py`, which is the file to look at
    # when a benchmark "regresses" in a commit that changed no source.
    #
    # What cannot be pinned here: GitHub rolls the image *version* under the
    # same label (20260907 -> 20260920 between #50's base and PR runs, with a
    # new glibc), and the pool mixes CPUs. A PR measured weeks after its base
    # can still be flagged for that; only dedicated runners remove it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version

      # uv is pinned because it picks the *interpreter*: each uv release embeds
      # its own python-build-standalone build, so "3.11.16" is not one binary.
      # Unpinned, the base run of #50 (uv 0.12.13) and its PR runs (0.12.19)
      # got 3.11.16 built on different dates with different LTO flags, and
      # CodSpeed flagged "Different runtime environments" -- on exactly the
      # dispatch-bound scalar benchmarks, which are mostly interpreter. Bump
      # this deliberately, and expect one run of environment changes when you do.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version-file: ".python-version"

      - name: Install
        run: uv sync --no-default-groups --group bench --locked

      # `-p no:env` disables pytest-env, which would otherwise set
      # SPEXIAL_ENABLE_RUNTIME_TYPECHECKING=beartype.beartype (see
      # [tool.pytest_env]). That beartype wrapping is a test-time aid; leaving it
      # on would measure the instrumented build rather than production
      # performance. `src/spexial/setup_package.py` defaults the variable to
      # "False", so simply not setting it is enough -- but JAX_ENABLE_X64, which
      # pytest-env also sets, *is* production-relevant, so it is set at job level.
      #
      # `benchmarks/conftest.py` additionally pins the CPU backend and a
      # single-threaded XLA pool, so the numbers do not move with the runner's
      # core count.
      - name: Run benchmarks under CodSpeed
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          JAX_ENABLE_X64: "True"
        with:
          mode: simulation
          # Every benchmark shares one process, so each inherits the allocator
          # state the previous ones left behind -- the likeliest cause, per
          # CodSpeed's variance docs, of sibling benchmarks moving in opposite
          # directions in an identical environment: on #52, which touched
          # neither, `test_zeta_vector[negative]` went -62% and `[positive]`
          # x2.1. What is measured here is JAX dispatch and XLA execution, not
          # malloc, so allocator time is left out.
          exclude-allocations: true
          run: uv run --frozen pytest benchmarks --codspeed -p no:env
          token: ${{ secrets.CODSPEED_TOKEN }}
