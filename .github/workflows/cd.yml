name: CD

# Tags only. Versioning is hatch-vcs keyed on `v*` tags, so the tag *is* the
# release trigger -- publishing off a GitHub Release instead would let the two
# drift apart. Deliberately no `pull_request`/`push: main` triggers: nothing
# here should run on ordinary development traffic.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3

jobs:
  build:
    name: Build & inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version
          persist-credentials: false

      # v3 or newer is required, not cosmetic: hatchling emits
      # `Metadata-Version: 2.5`, and this action's v2 line bundles twine 6.2.0,
      # whose `twine check --strict` rejects it with "'2.5' is not a valid
      # metadata version" -- which is what fails CD on main today. v3.0.1
      # bundles twine 7.0.0, which accepts it (verified against a locally built
      # wheel and sdist).
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spexial
    permissions:
      id-token: write # PyPI trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
