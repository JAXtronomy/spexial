name: CodeQL

# Advanced setup, replacing CodeQL's "default setup". Default setup never
# analyses pull requests from forks -- it scanned #23, #33, #34 and #38 (branches
# in this repository) but none of #47, #50, #52, #54 or #56 -- while the `PR
# branch` ruleset requires CodeQL results on every PR to `main`. Every fork PR
# was therefore blocked until an admin bypassed the rule. A `pull_request`
# workflow runs for forks too, and CodeQL accepts its upload.
#
# Default setup must be *disabled* (Settings -> Code security -> CodeQL
# analysis -> Switch to advanced) for this to work: code scanning rejects
# analyses from an advanced configuration while default setup is enabled.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1" # weekly, as default setup was

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        # The languages default setup covered. Neither needs a build.
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
