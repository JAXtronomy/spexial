# Environment for the Copilot cloud agent and Copilot code review.
#
# Copilot code review runs on a runner from this repository, taking its
# environment from this file. Without it, the review can fail to get a runner
# before its timeout, in which case only the non-agentic review runs and
# `.github/skills/code-review/SKILL.md` is never consulted.
#
# The job MUST be named `copilot-setup-steps`; only `steps`, `permissions`,
# `runs-on`, `services`, `snapshot` and `timeout-minutes` are honoured.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to derive a version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Install pre-commit hooks
        run: uv run --frozen prek install
