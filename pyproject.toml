[project]
authors = [
  { name = "Spexial Maintainers" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = ["jax>=0.7.2", "jaxlib>=0.7.2", "jaxtyping>=0.3.9"]
description = "scipy.special in JAX."
dynamic = ["version"]
keywords = ["jax", "scipy", "special-functions"]
license = "MIT"
license-files = ["LICENSE"]
name = "spexial"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
cpu          = ["jax[cpu]>=0.7.2"]
cuda12       = ["jax[cuda12]>=0.7.2"]
cuda12_local = ["jax[cuda12_local]>=0.7.2"]

[project.urls]
"Bug Tracker" = "https://github.com/JAXtronomy/spexial/issues"
Changelog     = "https://github.com/JAXtronomy/spexial/releases"
Documentation = "https://jaxtronomy.github.io/spexial"
Homepage      = "https://github.com/JAXtronomy/spexial"


[build-system]
build-backend = "hatchling.build"
requires      = ["hatch-vcs", "hatchling"]


[dependency-groups]
# Performance benchmarks. Kept out of `test` so the default suite never collects
# them. Run locally with `uv run nox -s pytest_benchmark`; CI runs them under
# CodSpeed.
bench = [
  { include-group = "test" },
  "pytest-benchmark>=5.1.0",
  "pytest-codspeed>=4.2.0",
]
build = ["build>=1.3.0"]
dev = [
  "cz-conventional-gitmoji>=0.6.1",
  "ipykernel>=6.29.5",
  { include-group = "bench" },
  { include-group = "build" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "nox" },
  { include-group = "test" },
  { include-group = "typecheck" },
]
docs = [
  "hippogriffe>=0.2.2",
  "mkdocstrings[python]>=1.0.4",
  "pymdown-extensions>=11",
  "zensical>=0.0.60",
  # The docs execute their own code blocks under Sybil, so the runtime has to
  # be installed alongside the site generator.
  "jax[cpu]>=0.7.2",
]
lint = ["prek>=0.3.11", "pylint>=3.3.8"]
nox = ["nox-uv>=0.6.3", "nox>=2024.10.9"]
test = [
  "beartype>=0.20.2",
  "hypothesis[numpy]>=6.138.14",
  # `Li` has no `scipy.special` counterpart; mpmath supplies the reference values.
  "mpmath>=1.3.0",
  "pytest-cov>=6.2.1",
  "pytest-env>=1.1.5",
  "pytest-github-actions-annotate-failures>=0.3.0",
  "pytest-xdist>=3.6.1",
  "pytest>=8.4.2",
  # The parity suite compares against scipy directly. It resolves transitively
  # through jax today; declare it so that stays true.
  "scipy>=1.11",
  "sybil[pytest]>=9.2.0",
]
# Pinned so the typing guards cannot drift as new checker releases change
# diagnostics. All scoped to the `tests/typing` fixture; see [tool.pyright],
# [tool.ty.src], and [tool.mypy].
typecheck = ["mypy==2.3.0", "pyright==1.1.411", "ty==0.0.64"]


[tool.hatch]
build.hooks.vcs.version-file = "src/spexial/_version.py"
build.hooks.vcs.version-file-template = """\
version: str = {version!r}
version_tuple: tuple[int, int, int] | tuple[int, int, int, str, str]
version_tuple = {version_tuple!r}
"""
version.source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/spexial"]

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "v*",
]


[tool.codespell]
skip = ["uv.lock"]


[tool.commitizen]
name = "cz_gitmoji"


[tool.coverage]
report.exclude_also = [
  # An `...` *body* (a stub or an abstract method), anchored so it cannot also
  # match an `...` inside a signature -- e.g. `Shaped[Array, "..."]`, which
  # would exclude the whole function from measurement.
  '^\s*\.\.\.\s*$',
  'if TYPE_CHECKING:',
  'if typing.TYPE_CHECKING:',
]
run.branch = true
run.source = ["spexial"]


# mypy is scoped (via `files`) to the typing smoke fixture -- the same signature
# guard as pyright ([tool.pyright]) and ty ([tool.ty.src]). Widen `files` when
# more of the tree is mypy-clean.
[tool.mypy]
disallow_incomplete_defs = false
disallow_untyped_defs    = false
enable_error_code        = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files                    = ["tests/typing"]
python_version           = "3.11"
strict                   = true
warn_return_any          = false
warn_unreachable         = true
warn_unused_configs      = true

[[tool.mypy.overrides]]
disallow_incomplete_defs = true
disallow_untyped_defs    = true
module                   = "spexial.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
# `mpmath`/`scipy` are used only in `tests/parity`, which mypy is not
# pointed at; listing them here trips `warn_unused_configs`. Re-add them
# when `files` widens beyond `tests/typing`.
module = ["jax.*", "jaxtyping.*", "numpy.*"]


[tool.pylint]
ignore-paths = [".*/_version.py"]
messages_control.disable = [
  "design",
  "fixme",
  "invalid-name",             # handled by ruff
  "line-too-long",
  "missing-module-docstring",
  "not-callable",             # handled by mypy
  "protected-access",         # handled by ruff
  "redefined-builtin",        # handled by ruff
  "unused-argument",          # handled by ruff
  "unused-import",            # handled by ruff
  "wrong-import-order",       # handled by ruff
  "wrong-import-position",
]
py-version = "3.11"
reports.output-format = "colorized"
similarities.ignore-imports = "yes"


# Pyright is scoped to the typing smoke fixture only -- it guards the public
# function signatures without asking the whole, not-yet-pyright-clean source
# tree to pass. Widen `include` when more of the tree is type-checked.
[tool.pyright]
include          = ["tests/typing"]
pythonVersion    = "3.11"           # match `requires-python = ">=3.11"`
typeCheckingMode = "basic"


[tool.pytest.ini_options]
addopts = [
  "--showlocals",
  "--strict-config",
  "--strict-markers",
  "-p no:doctest",    # using sybil
  "-ra",
]
filterwarnings = [
  "error",
  # Sybil
  "ignore:Attribute s is deprecated and will be removed in Python 3\\.14:DeprecationWarning",
  "ignore:ast\\.Str is deprecated and will be removed in Python 3\\.14:DeprecationWarning",
  # jax
  "ignore:jax\\.core\\.pp_eqn_rules is deprecated:DeprecationWarning",
  # numpy cannot probe `longdouble` when running under valgrind, which is how
  # the benchmarks are measured in CodSpeed's simulation mode.
  "ignore:Signature .* for <class 'numpy\\.longdouble'>:UserWarning",
]
log_level = "INFO"
minversion = "8.3"
norecursedirs = [".*", "__pycache__", "site"]
testpaths = ["README.md", "docs", "src/", "tests/"]
xfail_strict = true


[tool.pytest_env]
JAX_ENABLE_X64                      = "True"
SPEXIAL_ENABLE_RUNTIME_TYPECHECKING = "beartype.beartype"


[tool.repo-review]
# RTD100: this project publishes to GitHub Pages via Zensical, not Read the Docs.
# NOX103: `nox.options.sessions = ["all"]` is deliberate. Per-session
# `default=` does not achieve the same thing -- nox's `default` is True
# unless set, so relying on it selects every session, not just `all`.
ignore = ["NOX103", "PC140", "PC901", "PC902", "PC903", "RTD100"]


[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
  "COM812",  # <- for ruff.format
  "CPY001",  # Missing copyright notice at top of file -- not a convention here
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "F722",    # Syntax error in forward annotation <- jaxtyping
  "F821",    # undefined name '...' <- jaxtyping
  "FIX002",  # Line contains TODO
  "ISC001",  # Conflicts with formatter
  "N803",    # Argument name should be lowercase <- math notation (N, K0)
  "N806",    # Variable in function should be lowercase <- math notation
  "PD",      # Pandas
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "TD002",   # Missing author in TODO
  "TD003",   # Missing issue link on the line following this TODO
]

[tool.ruff.lint.per-file-ignores]
"docs/**"                 = ["A001", "INP001"]
"noxfile.py"              = ["T20"]
"src/spexial/_version.py" = ["SIM108"]
"tests/**"                = ["ANN", "D401", "E731", "INP001", "S101", "SLF001", "T20"]

[tool.ruff.lint.flake8-import-conventions.aliases]
"jax.numpy" = "jnp"
spexial     = "sp"

[tool.ruff.lint.isort]
combine-as-imports     = true
extra-standard-library = ["typing_extensions"]
known-local-folder     = ["spexial"]

[tool.ruff.format]
docstring-code-format = true


# ty is scoped to the same typing smoke fixture as pyright. Scoping via config
# -- rather than a CLI path -- keeps the nox/pre-commit invocation a plain
# `ty check`. Python version is read from `project.requires-python`.
[tool.ty.src]
include = ["tests/typing"]


[tool.uv]
# Require that the `spexial[<jax-extras>]` requirements are resolved in
# different forks so that they cannot conflict with one another.
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda12" },
    { extra = "cuda12_local" },
  ],
]
