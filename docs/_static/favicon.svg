<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="spexial">
  <title>spexial</title>
  <defs>
    <!-- The axis runs along the glyph, not across its bounding box. In
         objectBoundingBox units a corner-to-corner ramp puts its far end in the
         notch under the bar, which is empty, so only the first two thirds of
         the ramp ever landed on ink and the mark read as blue. Anchored in user
         space from the right end of the bar to the foot of the stem, visible
         ink spans offsets 0.08 to 0.94 and every stop shows. -->
    <linearGradient id="jax" gradientUnits="userSpaceOnUse" x1="48" y1="12" x2="18" y2="52">
      <stop offset="0" stop-color="#26a69a"/>
      <stop offset="0.5" stop-color="#5e97f6"/>
      <stop offset="1" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#14161a"/>
  <path d="M18 12 H48 V20 H27 V52 H18 Z" fill="url(#jax)"/>
</svg>
